<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Meu Assento V5</title>
  <meta name="theme-color" content="#1EAEB9">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7f8;color:#172033}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(560px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center}
    .badge{display:inline-block;background:#e8f7f8;color:#156f76;font-weight:700;border-radius:999px;padding:8px 14px;margin-bottom:18px}
    h1{margin:0 0 10px;font-size:30px}
    p{margin:0;color:#56626a;line-height:1.55}
    .ok{margin-top:24px;padding:16px;border-radius:16px;background:#f4f8f9;font-weight:600;color:#128C95}
    .small{margin-top:18px;font-size:13px;color:#8a949a}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Ambiente de homologação</div>
    <h1>Meu Assento V5</h1>
    <p>Frontend hospedado fora do Google Apps Script.</p>
    <div class="ok">Se você está vendo esta tela pela Vercel, a nova arquitetura está publicada corretamente.</div>
    <div class="small">Cabana Church</div>
  </main>
</body>
</html>
