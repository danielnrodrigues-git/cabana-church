<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Assento | Cabana Church</title>
<meta name="theme-color" content="#52ABB8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Assento">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
:root{--teal:#52ABB8;--teal-dark:#178e99;--ink:#172033;--muted:#68737d;--bg:#f5f8f9}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,rgba(82,171,184,.18),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(23,142,153,.10),transparent 35%),
    var(--bg);
  color:var(--ink);
  display:grid;
  place-items:center;
  padding:24px;
}
.shell{width:min(560px,100%);text-align:center}
.brand{
  width:92px;height:92px;border-radius:28px;
  background:linear-gradient(145deg,var(--teal),var(--teal-dark));
  margin:0 auto 28px;display:grid;place-items:center;
  box-shadow:0 18px 45px rgba(23,142,153,.22);
}
.brand svg{width:62px;height:38px}
.card{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.9);
  border-radius:28px;
  padding:34px 28px;
  box-shadow:0 20px 60px rgba(23,32,51,.09);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--teal-dark);background:#eaf7f8;
  border-radius:999px;padding:7px 11px;
  font-size:11px;font-weight:900;letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:18px
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal-dark)}
h1{font-size:34px;line-height:1.08;margin:0 0 14px;letter-spacing:-.8px}
p{font-size:16px;line-height:1.6;color:var(--muted);margin:0 auto;max-width:430px}
.divider{width:44px;height:3px;border-radius:999px;background:var(--teal);margin:24px auto}
.note{font-size:13px;color:#7d878e}
.church{margin-top:24px;font-size:12px;font-weight:900;letter-spacing:1.5px;color:#7a858c}
@media(max-width:520px){
  body{padding:18px}
  .card{padding:30px 20px;border-radius:24px}
  h1{font-size:29px}
  p{font-size:15px}
  .brand{width:82px;height:82px;border-radius:24px}
}
</style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Cabana Church">
      <svg viewBox="0 0 120 42" aria-hidden="true">
        <path d="M18 27 L51 7 Q60 2 69 7 L102 27 Q106 30 102 35 Q99 39 94 36 L65 19 Q60 16 55 19 L35 31 H61 Q65 31 68 34 L72 38 H33 Q27 38 22 34 L18 31 Q15 29 18 27Z"
          fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <section class="card">
      <div class="eyebrow"><span class="dot"></span> Meu Assento</div>
      <h1>Vem novidade por aí.</h1>
      <p>Estamos trabalhando em melhorias no nosso APP para tornar sua experiência ainda mais simples, organizada e especial.</p>
      <div class="divider"></div>
      <div class="note">Em breve, uma nova experiência estará disponível para você.</div>
    </section>

    <div class="church">CABANA CHURCH</div>
  </main>
</body>
</html>
