<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cabana Church</title>
  <meta name="theme-color" content="#1EAEB9">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f7f8;color:#172033;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center}
    h1{margin:0 0 8px}.sub{color:#66727a;margin:0 0 28px}.app{display:block;text-decoration:none;color:#172033;border:1px solid #e5eaec;border-radius:18px;padding:20px;text-align:left}.app strong{display:block;font-size:19px}.app span{display:block;color:#66727a;margin-top:4px}.badge{display:inline-block;background:#1EAEB9;color:#fff;font-weight:700;border-radius:12px;padding:8px 12px;margin-bottom:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Cabana Church</div>
    <h1>Recursos digitais</h1>
    <p class="sub">Acesso aos aplicativos e ferramentas da Cabana Church.</p>
    <a class="app" href="./assentos/"><strong>Assentos</strong><span>Reserva de assentos pastorais</span></a>
  </main>
</body>
</html>
